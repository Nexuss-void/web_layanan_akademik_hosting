{% load static %}
{% include 'layout_admin_dashboard/header.html' %}
        <!-- MAINN -->
        <main class="main">
            <!-- TOPBAR -->
            <div class="topbar">
                <!-- Hamburger: hanya tampil di mobile -->
                <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div>
                    <h1 class="page-title">Hasil Analisis</h1>
                    <div class="page-sub">Hasil analisis dalam bentuk pie chart.</div>
                </div>
                <div class="topbar-right">
                    <div class="user-chip">
                        <div class="avatar">AD</div>
                        <div>
                            <div class="name">Admin</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="content-body">
                <!-- FILTER -->
                <div class="form-card">
                    <div class="form-section">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>
                                    Periode Kuesioner
                                </label>
                                <form method="GET">
                                    <input type="hidden" name="fakultas" value="{{ selected_fakultas }}">
                                    <select name="period">
                                        <option value="" disabled selected>— Pilih Periode —</option>
                                        {% for period in periods %}
                                        <option value="{{ period.id }}" {% if selected_period.id == period.id %} selected {% endif %}>
                                            {{ period.tahun_ajaran }} ({{ period.semester }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                    <button class="btn btn-primary" type="submit">
                                        Terapkan
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- PIE CHART -->
                <div class="chart-grid">
                    {% for category,data in analysis.items %}
                    <div class="chart-card">
                        <div class="chart-title">
                            {{ category }}
                        </div>
                        <div class="chart-container">
                            <canvas id="chart{{ forloop.counter }}"></canvas>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {{ analysis|json_script:"analysis-data" }}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'assets/js/analysis.js' %}"></script>
    <script src="{% static 'assets/js/sidebar.js' %}"></script>
</body>
</html>
