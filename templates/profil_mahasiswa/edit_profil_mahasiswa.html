{% load static %}
{% include 'layout_admin_dashboard/header.html' %}
                <!-- TITLE PAGE -->
                <div class="profile-hero">
                    <div class="profile-hero-text">
                        <div class="profile-hero-name">Edit Data Mahasiswa</div>
                        <div class="profile-hero-tag">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.7" />
                                <path d="M12 8V12M12 16H12.01" stroke="white" stroke-width="1.8" stroke-linecap="round" />
                            </svg>
                            Pastikan untuk edit data dengan benar dan teliti
                        </div>
                        <br>
                    </div>
                </div>
                <!-- FORM -->
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-card">
                        <!-- Data Pribadi -->
                        <div class="form-section">
                            <div class="form-grid">
                                <div class="form-group full">
                                    <label>Nama Lengkap <span class="required-dot"></span></label>
                                    <input type="text" name="nama" value="{{ profil.nama|default:'' }}" required
                                        inputmode="email">
                                </div>
                                <div class="form-group">
                                    <label>NIM <span class="required-dot"></span></label>
                                    <input type="text" name="nim" value="{{ profil.nim|default:'' }}" pattern="[0-9]+" required
                                        maxlength="12" inputmode="numeric">
                                    <span class="hint">Nomor Induk Mahasiswa</span>
                                </div>
                                <div class="form-group">
                                    <label>Nomor HP <span class="required-dot"></span></label>
                                    <input type="tel" name="nomor_hp" value="{{ profil.nomor_hp|default:'' }}" pattern="[0-9]+"
                                        required inputmode="tel" maxlength="20">
                                </div>
                                <div class="form-group full">
                                    <label>Alamat</label>
                                    <textarea name="alamat" rows="4" cols="50"
                                        required>{{ profil.alamat|default:'' }}</textarea>
                                </div>
                            </div>
                        </div>
                        <!-- Data Akademik -->
                        <div class="form-section">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Jurusan <span class="required-dot"></span></label>
                                    <select id="jurusan" name="jurusan" required>
                                        <option value="" disabled {% if not profil.jurusan %}selected{% endif %}>— Pilih Jurusan —</option>
                                        <option value="Teknik Informatika" {% if profil.jurusan == "Teknik Informatika" %}selected{% endif %}>
                                            Teknik Informatika
                                        </option>
                                        <option value="Ekonomi" {% if profil.jurusan == "Ekonomi" %}selected{% endif %}>
                                            Ekonomi
                                        </option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Fakultas <span class="required-dot"></span></label>
                                    <input type="text" id="fakultas" name="fakultas" value="{{ profil.fakultas|default:'' }}" readonly required>
                                </div>
                                <div class="form-group">
                                    <label>Semester <span class="required-dot"></span></label>
                                    <input type="number" id="semester" name="semester" value="{{ profil.semester|default:'' }}" readonly required>
                                </div>
                            </div>
                        </div>
                        <!-- FOOTER -->
                        <div class="form-footer">
                            <button class="btn btn-primary" type="submit">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                    <path d="M19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H16L21 8V19C21 20.1 20.1 21 19 21Z"
                                        stroke="white" stroke-width="1.7" stroke-linejoin="round" />
                                    <path d="M17 21V13H7V21M7 3V8H15" stroke="white" stroke-width="1.7"
                                        stroke-linejoin="round" />
                                </svg>
                                Simpan
                            </button>
                        </div>
                    </div>
                </form>
            </div>
    {% include 'layout_admin_dashboard/footer.html' %}
    <script src="{% static 'assets/js/form_profile.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'assets/js/alert.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            {% if messages %}
                {% for message in messages %}
                    showToast(
                        "{{ message.tags }}",
                        "{{ message|escapejs }}"
                    );
                {% endfor %}
            {% endif %}

            {% if error_nim %}
                showToast(
                    "error",
                    "{{ error_nim|escapejs }}"
                );
            {% endif %}
        });
    </script>
</body>
</html>
